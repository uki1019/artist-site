<!DOCTYPE html>

    <head>

    <body>
      
        <!-- メインビジュアル -->
    <!-- 背景：先看见“低饱和+轻微模糊”的图 -->

        <!-- icon -->
<!-- 可点击按钮 -->
<button class="orbit-btn">
    <!-- 三个圈 -->
    <svg class="rings" viewBox="0 0 100 100" fill="none">
      <ellipse cx="50" cy="50" rx="30" ry="12"/>
      <ellipse cx="50" cy="50" rx="30" ry="12" transform="translate(0,-6)"/>
      <ellipse cx="50" cy="50" rx="30" ry="12" transform="translate(0,6)"/>
    </svg>
  </button>
  
<!-- 椭圆菜单 Overlay -->
<div class="oval-menu" id="ovalMenu" aria-hidden="true">
    <!-- 背景毛玻璃层 + 半透明底色 -->
    <div class="oval-bg"></div>
  
    <!-- 白色描边（用SVG更顺滑） -->
    <svg class="oval-stroke" viewBox="0 0 1000 560" aria-hidden="true">
      <ellipse cx="500" cy="280" rx="480" ry="250" fill="none"/>
    </svg>
  
    <!-- 菜单内容 -->
    <nav class="oval-content">
